{% extends "base.html" %}
{% block title %}Candidate Login - AI Proctor{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-user-lock"></i>
            <h2>Candidate Login</h2>
            <p>Enter your credentials to enter the proctored test environment</p>
        </div>
        <form action="/login" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username or Email</label>
                <input type="text" id="username" name="username" placeholder="student1 or student1@exam.org" required>
            </div>
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-block btn-primary"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Exam</button>
        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a href="/signup">Register here</a></p>
            <p class="demo-hint"><i class="fa-solid fa-circle-info"></i> Demo credentials: <b>student1</b> / <b>password123</b></p>
        </div>
    </div>
</div>
{% endblock %}
